# Build workflow for fork builds
# Mirrors the upstream release.yml structure but without requiring
# code signing keys, Sentry DSN, PostHog, Supabase, or any secrets.

name: Build Fork

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tauri:
    name: ${{ matrix.config.release }} ${{ matrix.config.arch || '' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
            release: android
            rust_target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          - os: ubuntu-22.04
            release: linux
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            # No --target flag => cargo outputs to the workspace root target/
            bundle_path: target/release/bundle
          - os: macos-latest
            release: macos
            arch: aarch64
            rust_target: x86_64-apple-darwin,aarch64-apple-darwin
            args: '--target universal-apple-darwin'
            # cargo --target universal-apple-darwin outputs under that triple
            bundle_path: target/universal-apple-darwin/release/bundle
          - os: windows-latest
            release: windows
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
            bundle_path: target/x86_64-pc-windows-msvc/release/bundle

    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git submodule update --init --recursive

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Java + Android SDK
        if: matrix.config.release == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.config.release == 'android'
        uses: android-actions/setup-android@v4

      - name: Install NDK
        if: matrix.config.release == 'android'
        run: sdkmanager "ndk;28.2.13676358"

      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @readest/readest-app setup-vendors

      # dtolnay/rust-toolchain accepts a comma-separated `targets` input.
      # (actions-rs/toolchain@v1 is deprecated and only knows `target`, so the
      # requested targets silently never got installed.)
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.config.os }}-${{ matrix.config.release }}-${{ matrix.config.arch }}-cargo

      - name: Install Linux system deps
        if: matrix.config.release == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libfontconfig-dev libgtk-3-dev \
            libwebkit2gtk-4.1 libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev \
            gir1.2-javascriptcoregtk-4.1 gir1.2-webkit2-4.1 \
            libappindicator3-dev librsvg2-dev patchelf xdg-utils

      # The npm cli-cef bundles the AppImage with a broken quick-sharun fork
      # and cannot be pointed elsewhere; it dies with
      #   quick-sharun command failed to run: ... set: can't access tty
      # Build the CLI from readest/tauri instead: its sharun_cef.rs pins
      # pkgforge's deployment-array quoting fix (Anylinux-AppImages#855) and
      # runs the tooling with bash and streamed output. Rev-pinned; the marker
      # skips the rebuild while rust-cache keeps ~/.cargo/bin.
      # scripts/tauri.mjs runs `cargo tauri` when TAURI_CEF_CARGO=1.
      - name: Install the CEF tauri CLI from readest/tauri (linux only)
        if: matrix.config.release == 'linux'
        run: |
          set -euo pipefail
          rev=6beeb209b5514f597a26f48b7a5b9fe4c59b5f12
          marker="$HOME/.cargo/bin/.cargo-tauri-rev"
          if [ -x "$HOME/.cargo/bin/cargo-tauri" ] && [ "$(cat "$marker" 2>/dev/null)" = "$rev" ]; then
            echo "cargo-tauri at $rev already installed"
            exit 0
          fi
          cargo install tauri-cli --git https://github.com/readest/tauri --rev "$rev" --locked --force
          echo "$rev" > "$marker"

      # Chromium dlopens NSS, libpulse and libspeechd by soname; whatever the
      # bundle lacks comes from the host at run time and fails against the
      # bundled glibc on any newer distro. Debian keeps the NSS modules in
      # <triple>/nss/ where quick-sharun's Arch-layout globs miss them, and
      # nothing deploys libspeechd. libxkbcommon-x11 is dlopened by winit when
      # it opens its X11 loop (the CEF runtime forces X11 even on Wayland);
      # the runner image has no copy for quick-sharun to deploy.
      - name: Stage CEF AppImage runtime libraries (linux only)
        if: matrix.config.release == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y libnss3 libpulse0 libspeechd2 libxkbcommon-x11-0
          nss_dir=$(dirname "$(ls /usr/lib/*-linux-gnu/nss/libsoftokn3.so)")
          lib_dir=${nss_dir%/nss}
          sudo cp -f --remove-destination "$nss_dir"/*.so "$lib_dir/"
          # +=: tauri.conf.json already ships the AppRun hook entry.
          conf=apps/readest-app/src-tauri/tauri.conf.json
          jq --arg d "$lib_dir" '.bundle.linux.appimage.files += {
              "/usr/lib/libspeechd.so.2": ($d + "/libspeechd.so.2"),
              "/usr/lib/libxkbcommon-x11.so.0": ($d + "/libxkbcommon-x11.so.0")
            }' "$conf" > "$conf.tmp" && mv "$conf.tmp" "$conf"

      - name: Build Tauri app
        # This script is bash. Windows runners default to PowerShell, which
        # cannot parse `if [ ... ]; then` and fails instantly (exit 1 in <1s).
        shell: bash
        working-directory: apps/readest-app
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          # Linux only: build with the readest/tauri CLI installed above, so
          # the AppImage bundles through the patched quick-sharun. scripts/
          # tauri.mjs switches to `cargo tauri` when this is 1.
          TAURI_CEF_CARGO: ${{ matrix.config.release == 'linux' && '1' || '' }}
        run: |
          if [ "${{ matrix.config.release }}" = "android" ]; then
            rm -rf src-tauri/gen/android
            pnpm tauri android init
            pnpm tauri icon ../../data/icons/readest-book.png
            # Restore the committed (patched) gen/android files that init/icon
            # overwrote — most importantly app/build.gradle.kts, which carries
            # `missingDimensionStrategy("store", "foss")` so gradle can resolve
            # the native-bridge plugin's foss/googleplay flavors. Without this
            # the APK build fails variant resolution (mirrors upstream
            # release.yml's `git checkout .`).
            git checkout .
            pnpm tauri android build
            mkdir -p dist/android
            find src-tauri/gen/android -name "*.apk" -exec cp {} dist/android/ \;
          else
            pnpm tauri build ${{ matrix.config.args }}
          fi

      - name: List build artifacts
        shell: bash
        env:
          BUNDLE_PATH: ${{ matrix.config.bundle_path || '' }}
        run: |
          if [ -n "$BUNDLE_PATH" ]; then
            echo "=== Tauri bundles: $BUNDLE_PATH ==="
            find "$BUNDLE_PATH" -type f 2>/dev/null | head -20 || echo "(empty)"
          fi
          echo "=== APKs ==="
          find apps/readest-app/dist -name "*.apk" 2>/dev/null | head -5 || echo "(none)"

      - name: Upload desktop bundles
        if: matrix.config.release != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: readest-${{ matrix.config.release }}-${{ matrix.config.arch }}
          path: ${{ matrix.config.bundle_path }}/
          if-no-files-found: error

      - name: Upload Android APKs
        if: matrix.config.release == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: readest-android-multi
          path: apps/readest-app/dist/
          if-no-files-found: error

  build-web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @readest/readest-app setup-vendors
      - name: Build web (static export)
        working-directory: apps/readest-app
        env:
          NEXT_PUBLIC_APP_PLATFORM: tauri
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm build-web
      - uses: actions/upload-artifact@v4
        with:
          name: readest-web
          path: apps/readest-app/out/
          if-no-files-found: warn
