name: Upload Release Assets to R2

# Disabled for fork.
#
# This is the upstream job that mirrors release assets to Cloudflare R2. It
# needs RELEASE_R2_ACCOUNT_ID / RELEASE_R2_ACCESS_KEY_ID /
# RELEASE_R2_SECRET_ACCESS_KEY, a signed release, and a tag that exists on
# readest/readest. This fork has none of those, so the job is stubbed out
# rather than left one dispatch away from failing on missing secrets.
#
# The original body lives in upstream's .github/workflows/upload-to-r2.yml.

on: workflow_dispatch

permissions:
  contents: read

jobs:
  disabled-for-fork:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "R2 upload is disabled in this fork."
